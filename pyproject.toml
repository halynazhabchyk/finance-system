[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Shared infrastructure package used by all services. Third-party dependencies
# are pinned in each service's requirements.txt (each service needs only part of shared).
[project]
name = "finance-shared"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["shared*"]
exclude = ["*.tests", "*.tests.*"]

# Root-level test suites: shared/*/tests and a2a_chat/tests.
[tool.pytest.ini_options]
pythonpath = ["."]
