http:
  routers:
    gateway-docs:
      rule: "Path(`/docs`)"
      entryPoints:
        - web
      priority: 1100
      service: user-service@consulcatalog
      middlewares:
        - gateway-docs-path
    traefik-dashboard:
      rule: "PathPrefix(`/dashboard`) || PathPrefix(`/api/http`) || PathPrefix(`/api/overview`) || PathPrefix(`/api/version`)"
      entryPoints:
        - web
      priority: 1000
      service: api@internal

    # ЛР №5: Keycloak is not registered in Consul, so its route lives in the file provider.
    # The path is not rewritten: Keycloak itself serves /auth (KC_HTTP_RELATIVE_PATH).
    keycloak:
      rule: "PathPrefix(`/auth`)"
      entryPoints:
        - web
      priority: 50
      service: keycloak

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

  middlewares:
    gateway-docs-path:
      replacePath:
        path: /docs

    # ЛР №5, п. 6.3: security headers on every response of the "web" entrypoint
    # (attached in docker-compose.yml). No accessControl* here: CORS stays in the services.
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer"
